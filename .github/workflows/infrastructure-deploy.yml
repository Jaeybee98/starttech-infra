name: "Production Infrastructure Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

jobs:
  terraform:
    name: "Terraform Validation & Plan"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the infrastructure code repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS administrative deployment access keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Setup the Terraform runtime engine CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # 4. Initialize working directories and module linkages
      - name: Terraform Init
        run: cd terraform && terraform init

      # 5. Check formatting compliance
      - name: Terraform Format Check
        run: cd terraform && terraform fmt -check

      # 6. Validate configuration logic
      - name: Terraform Validate
        run: cd terraform && terraform validate

      # 7. Generate a dry-run execution blueprint
      - name: Terraform Plan
        run: cd terraform && terraform plan
      
      # 8. Auto-Approve Apply
      - name: Terraform Apply
        run: cd terraform && terraform apply -auto-approve
